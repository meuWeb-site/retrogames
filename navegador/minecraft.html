<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogue Minecraft 1.8.8 diretamente no navegador pelo WASM Arcade.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script+Swash+Caps:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/x-icon">
    <title>Minecraft - Retro Games</title>
</head>
<body data-theme="dark">
    <div id="app" data-page-title="Minecraft" data-home-href="../index.html"></div>

    <template id="page-main-template">
        <section class="browser-game-shell">
            <article class="browser-game-card">
                <img class="browser-game-art" src="../assets/images/navegador/minecraft.png" alt="Capa do jogo Minecraft">
                <div class="browser-game-content">
                    <span class="browser-game-kicker">Jogo de navegador · Minecraft 1.8.8</span>
                    <h1>Minecraft</h1>
                    <p>
                        Explore, construa e sobreviva em mundos de blocos diretamente no navegador. Esta versão de Minecraft 1.8.8 roda por meio do EaglercraftX com WebAssembly, e seus mundos ficam salvos no próprio dispositivo.
                    </p>
                    <p>
                        Para uma melhor experiência, jogue em um computador com teclado e mouse e use um navegador atualizado com suporte a WebGL 2.0.
                    </p>
                    <a class="browser-play-button" href="https://wasmarcade.com/minecraft" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-play-fill" aria-hidden="true"></i>
                        Jogar no WASM Arcade
                    </a>
                </div>
            </article>
        </section>
    </template>

    <script type="module" src="../assets/js/game-page.js"></script>
</body>
</html>
