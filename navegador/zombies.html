<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script+Swash+Caps:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/x-icon">
    <title>Zombies - Retro Games</title>
</head>
<body data-theme="dark">
    <div id="app" data-page-title="Zombies" data-home-href="../index.html"></div>

    <template id="page-main-template">
        <section class="browser-game-shell">
            <article class="browser-game-card">
                <img class="browser-game-art" src="zombies-concentric.png" alt="Imagem do jogo Zombies hospedado em Concentric Live">
                <div class="browser-game-content">
                    <span class="browser-game-kicker">Jogo de navegador</span>
                    <h1>Zombies</h1>
                    <p>
                        Zombies, hospedado em Concentric Live, é uma versão refeita por fãs (fan-made), jogada diretamente no navegador, sem precisar baixar nada ou criar uma conta.
                    </p>
                    <p>
                        <strong>Inspiração:</strong> um remake inspirado no clássico modo Zumbis, baseado em rodadas, de Call of Duty: World at War e Call of Duty: Black Ops.
                    </p>
                    <a class="browser-play-button" href="https://zombies.concentric.live/" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-play-fill" aria-hidden="true"></i>
                        Abrir o jogo
                    </a>
                </div>
            </article>
        </section>
    </template>

    <script type="module" src="../assets/js/game-page.js"></script>
</body>
</html>
